<body>
<div class="app">
<header class="top">

  </header>
<main id="sc"><div id="refreshIndicator" class="refresh-indicator" aria-hidden="true"><span class="refresh-spinner"></span><span id="refreshLabel">Pull to refresh</span></div><div id="v"></div></main>
  <section class="mini" id="mini" aria-label="Now playing" inert>

</div>
<script>
const $=s=>document.querySelector(s);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const IC={
 home:'M3 11l9-8 9 8v10h-6v-6H9v6H3z',
 vid:'M4 5h16v14H4zM10 9l5 3-5 3z',
 music:'M9 18V5l11-2v13M9 18a3 3 0 11-6 0 3 3 0 016 0zM20 16a3 3 0 11-6 0 3 3 0 016 0z',
 news:'M4 4h13v16H4zM17 8h3v10a2 2 0 01-2 2M7 8h7M7 12h7M7 16h4',
 search:'M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-4-4',
 play:'M7 4l13 8-13 8z', pause:'M7 5h3v14H7zM14 5h3v14h-3z',
 arrow:'M5 12h14M13 6l6 6-6 6', follow:'M12 5v14M5 12h14', library:'M4 4h13v16H4zM7 8h7M7 12h7M7 16h4M19 7v13'
};
const FILL=['play','pause'];
const ic=n=>'<svg class="ic'+(FILL.includes(n)?' f':'')+'" viewBox="0 0 24 24" aria-hidden="true"><path d="'+(IC[n]||IC.arrow)+'"/></svg>';
const PAL=['#FF6B3D','#4D7DFF','#D8FF3F','#35E0E0','#B58CFF','#3DDC84'];
const TOPICS=['Science','Technology','AI and machine learning','Programming','Cybersecurity','History','Geography','Education','Languages','Literature','Books','Philosophy','Psychology','Mathematics','Space','Engineering','Economics','Business','Startups','Personal finance','Investing','Politics','Current affairs','World news','Environment','Climate','Health','Medicine','Fitness','Sports','Football','Basketball','Cricket','Esports','Gaming','Game development','Design','Art','Photography','Architecture','Fashion','Beauty','Makeup','Cooking','Food','Travel','Cars','Motorcycles','Nature','Wildlife','Pets','Gardening','Home improvement','Music','Music production','Classical music','Hip-hop','K-pop','Film analysis','Anime','Manga','Podcasts','Documentaries','Vlogs','Comedy','Memes','Viral clips','Celebrity gossip','Pranks','Internet drama','Rage bait','Reality TV','Shorts','ASMR','Luxury','Shopping','Product reviews','Relationships','Parenting','Lifestyle','Meditation','Self-improvement','Romance','Horror','Internet culture','Streaming','Live streams','Board games','Collecting','Crafts'];
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=v=>/^https:\/\/[^\s"'<>]+$/i.test(String(v||''))?String(v):'';
let prefs={topics:['Science','Technology','History','Education','Design','Engineering','Economics','Culture','Environment','Sports','Music','Health','Language','Business','Art','Documentaries'],sources:[]};
let page='home',homeTab='fy',unifiedMode='all',unifiedQuery='',unifiedPending=0,searchSort='relevance',mediaState={hasItem:false,isMusic:false,isVideo:false,isPlaying:false,title:'',artist:'',artwork:''};
const unifiedData={videos:[],music:[],news:[],channels:[],playlists:[]};
let publicPlaylistData=null;
const selectedTopics=()=>prefs.topics||[];
function loadPrefs(){
 try{if(window.RushNative){const raw=RushNative.getFeedPreferences();if(raw)prefs=JSON.parse(raw)}}catch(e){}
}
function saveTopics(){
 const selected=[...document.querySelectorAll('[data-topic][aria-pressed="true"]')].map(b=>b.dataset.topic);
 if(!selected.length){const s=$('#topicStatus');if(s)s.textContent='Choose at least one topic.';return}
 if(window.RushNative)RushNative.saveFeedTopics(JSON.stringify(selected));
}
function sourceExists(kind,id){return prefs.sources.some(s=>s.kind===kind&&s.id===id)}
function sourceFor(kind,id){return prefs.sources.find(s=>s.kind===kind&&s.id===id)}
function sourceButton(kind,id,name,label){
 const found=sourceExists(kind,id);
 return '<button class="chip source-follow" data-follow-kind="'+esc(kind)+'" data-source-id="'+esc(id)+'" data-source-name="'+esc(name)+'">'+(found?'FOLLOWING':(label||'FOLLOW'))+'</button>';
}
function channelCard(x){
 const thumb=safeUrl(x.thumbnail);
 return '<article class="source-card"><img src="'+esc(thumb)+'" alt="" loading="lazy" decoding="async" onerror="this.hidden=true"><div class="source-info"><b>'+esc(x.name)+'</b><span>'+esc(x.subscribers||'YouTube channel')+'</span><p>'+esc(x.description||'')+'</p><div class="source-actions">'+sourceButton('channel',x.id,x.name,'FOLLOW')+'</div></div></article>';
}

function mediaActions(x,isMusic){
 const id=esc(x.id),title=esc(x.title),creator=esc(isMusic?(x.artist||x.creator):(x.artist||x.creator)),thumb=esc(safeUrl(x.thumbnail));
 return '<div class="result-actions"><button class="chip" data-save-item data-id="'+id+'" data-title="'+title+'" data-creator="'+creator+'" data-music="'+isMusic+'" data-thumbnail="'+thumb+'">SAVE</button>'+
  '<button class="chip" data-queue-item data-id="'+id+'" data-title="'+title+'" data-creator="'+creator+'" data-music="'+isMusic+'" data-thumbnail="'+thumb+'">QUEUE</button>'+
  '<button class="chip" data-download-media data-id="'+id+'" data-title="'+title+'" data-creator="'+creator+'" data-music="'+isMusic+'">DOWNLOAD</button>'+
  (isMusic?'<button class="chip" data-download-mp3 data-id="'+id+'" data-title="'+title+'" data-creator="'+creator+'">MP3</button>':'')+'</div>';
}
function playlistRow(x){
 return '<article class="source-card"><img src="'+esc(safeUrl(x.thumbnail))+'" alt="" loading="lazy" decoding="async" onerror="this.hidden=true"><div class="source-info"><b>'+esc(x.title)+'</b><span>'+esc(x.creator||'YouTube')+' · '+esc(x.videoCount||'Playlist')+'</span><div class="result-actions"><button class="chip" data-public-playlist-open data-playlist-id="'+esc(x.id)+'" data-playlist-title="'+esc(x.title)+'">VIEW PLAYLIST</button></div></div></article>';
}
function mediaThumbnail(url,alt){
 const thumb=safeUrl(url);
 return '<span class="media-thumb">'+(thumb?'<img src="'+esc(thumb)+'" alt="'+esc(alt||'')+'" loading="lazy" decoding="async" onerror="this.hidden=true">':'<span class="media-thumb-empty">NO PREVIEW</span>')+'</span>';
}
function videoRow(x){
 const thumb=safeUrl(x.thumbnail);
 return '<article class="result-wrap"><button class="media-main" data-video-id="'+esc(x.id)+'" data-title="'+esc(x.title)+'" data-creator="'+esc(x.artist||x.creator)+'" data-thumbnail="'+esc(thumb)+'"><span class="media-copy"><b>'+esc(x.title)+'</b><span>'+esc(x.artist||x.creator||'YouTube')+' · '+esc(x.duration||'')+'</span></span>'+mediaThumbnail(thumb,x.title)+'<span class="media-play">'+ic('play')+'</span></button>'+mediaActions(x,false)+'</article>';
}
function musicRow(x){
 const thumb=safeUrl(x.thumbnail);
 return '<article class="result-wrap"><button class="media-main" data-track="'+esc(x.id)+'" data-title="'+esc(x.title)+'" data-artist="'+esc(x.artist)+'" data-thumbnail="'+esc(thumb)+'"><span class="media-copy"><b>'+esc(x.title)+'</b><span>'+esc(x.artist||'Unknown artist')+' · '+esc(x.duration||'')+'</span></span>'+mediaThumbnail(thumb,x.title)+'<span class="media-play">'+ic('play')+'</span></button><div class="result-actions">'+sourceButton('artist',x.artist,x.artist,'FOLLOW ARTIST')+'</div>'+mediaActions(x,true)+'</article>';
}
function musicHistoryRow(x){return '<article class="result-wrap history-row">'+videoLikeMusic(x)+'</article>'}
function videoLikeMusic(x){
 const thumb=safeUrl(x.thumbnail);
 return '<button class="media-main" data-track="'+esc(x.id)+'" data-title="'+esc(x.title)+'" data-artist="'+esc(x.artist)+'" data-thumbnail="'+esc(thumb)+'"><span class="media-copy"><b>'+esc(x.title)+'</b><span>'+esc(x.artist||'Unknown artist')+' · '+esc(x.duration||'')+'</span></span>'+mediaThumbnail(thumb,x.title)+'<span class="media-play">'+ic('play')+'</span></button>';
}
function newsCard(x){
 const thumb=safeUrl(x.thumbnail),publisher=x.source||'News publisher';
 const image='<span class="news-thumb-wrap"><span class="news-thumb-fallback">NEWS</span>'+(thumb?'<img class="news-thumb" src="'+esc(thumb)+'" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.hidden=true">':'')+'</span>';
 return '<article class="news-card"><button class="news-open" data-news-url="'+esc(safeUrl(x.url))+'"><span class="news-copy"><b>'+esc(x.title)+'</b><p>'+esc(x.summary||'Open the article for the full report.')+'</p><span class="news-meta">'+esc(publisher)+' · '+esc(x.date||'')+'</span></span>'+image+'</button><div class="result-actions">'+sourceButton('news',publisher,publisher,'FOLLOW PUBLISHER')+'</div></article>';
}
function section(title,body){
 return '<section class="feed-section"><h2>'+title+'</h2>'+(body||'<p class="meta pad">Nothing to show yet.</p>')+'</section>';
}
function pageTop(title,kicker){
 return '<header class="pt"><h1>'+title+'</h1><em class="stk">'+kicker+'</em></header>';
}
let homeTasteMusic=[],homeFeedData={videos:[],music:[],news:[],message:''};

 return pageTop('Home','your feed')+
 '<div class="seg" role="tablist"><i></i><button role="tab" data-tab="fy" aria-selected="'+(homeTab==='fy')+'">For you</button><button role="tab" data-tab="fo" aria-selected="'+(homeTab==='fo')+'">Following</button></div>'+
 '<div class="feed-actions"><button class="chip" data-open-topics>CHOOSE TOPICS</button></div>'+
 '<p class="meta pad" id="homeFeedStatus" aria-live="polite">Building your feed…</p><div id="homeFeedResults"></div>';

 return '<section class="player-screen"><div class="player-head"><button class="chip" data-player-back>← MUSIC</button><span class="stk">NOW PLAYING</span></div>'+

 '<div class="player-track"><div class="player-track-copy"><h2 id="playerTitle">Choose a track</h2><p id="playerArtist">Your next favourite song starts here.</p><p class="meta" id="playerStatus" aria-live="polite">Nothing is playing yet.</p></div><button class="ib" id="playerSave" data-player-save aria-label="Save current track" disabled>♡</button></div>'+

function formatBytes(bytes){
 const n=Math.max(0,Number(bytes)||0);if(n<1024)return n+' B';const units=['KB','MB','GB'];let value=n/1024,index=0;while(value>=1024&&index<units.length-1){value/=1024;index++}return value.toFixed(1)+' '+units[index];
}

function setupNavigationBehavior(){
 const sc=$('#sc'),app=$('.app'),indicator=$('#refreshIndicator'),label=$('#refreshLabel');
 if(!sc||!app)return;
 let lastTop=0,startX=0,startY=0,pull=0,gestureTarget=null;
 const ignoreSwipe='.car,.chips,.lyrics-panel,.player-controls,.player-progress,.library-tabs,input,select,textarea';
 sc.addEventListener('scroll',()=>{
  const top=sc.scrollTop;
  if(top<=10||top<lastTop-5)app.classList.remove('nav-hidden');
  else if(top>lastTop+5&&top>56)app.classList.add('nav-hidden');
  lastTop=top;
 },{passive:true});
 document.addEventListener('pointerdown',event=>{
  if(event.target.closest('#nav,.top')||event.clientY<76||event.clientY>window.innerHeight-92)app.classList.remove('nav-hidden');
 },{passive:true});
 sc.addEventListener('touchstart',event=>{
  if(!event.touches.length)return;
  const touch=event.touches[0];startX=touch.clientX;startY=touch.clientY;pull=0;gestureTarget=event.target;
 },{passive:true});
 sc.addEventListener('touchmove',event=>{
  if(!event.touches.length)return;
  const touch=event.touches[0],dx=touch.clientX-startX,dy=touch.clientY-startY;
  if(Math.abs(dx)>Math.abs(dy)*1.15)return;
  if(page==='home'&&sc.scrollTop<=0&&dy>14){
   pull=Math.min(104,dy*.58);
   if(indicator){indicator.classList.add('active');indicator.classList.remove('loading');indicator.style.setProperty('--pull-y',pull+'px')}
   if(label)label.textContent=pull>=68?'Release to refresh':'Pull to refresh';
   if(event.cancelable)event.preventDefault();
  }
 },{passive:false});
 sc.addEventListener('touchend',event=>{
  const changed=event.changedTouches&&event.changedTouches[0];
  const dx=(changed?changed.clientX:startX)-startX,dy=(changed?changed.clientY:startY)-startY;
  if(pull>=68&&page==='home'){
   if(indicator)indicator.classList.add('loading');
   if(label)label.textContent='Refreshing…';
   loadHomeFeed();if(homeTab==='fy'&&window.RushNative)RushNative.loadMusicSuggestions();
  }
  if(pull>0)setTimeout(()=>{
   if(indicator){indicator.classList.remove('active','loading');indicator.style.removeProperty('--pull-y')}
   if(label)label.textContent='Pull to refresh';
  },650);
  if(Math.abs(dx)>72&&Math.abs(dx)>Math.abs(dy)*1.25&&!(gestureTarget&&gestureTarget.closest(ignoreSwipe))){
   const current=page==='player'?'music':page,index=NAV.findIndex(item=>item[0]===current),next=index+(dx<0?1:-1);
   if(index>=0&&NAV[next]){app.classList.remove('nav-hidden');location.hash='#'+NAV[next][0]}
  }
  pull=0;
 },{passive:true});
}

function mixHomeFeedItems(videos,music,articles){
 const pools={video:videos||[],music:music||[],news:articles||[]};
 const order=['video','video','music','news'],positions={video:0,music:0,news:0};
 const total=pools.video.length+pools.music.length+pools.news.length;
 const mixed=[];let cursor=0;
 while(mixed.length<total){
  let picked=false;
  for(let attempt=0;attempt<order.length;attempt++){
   const kind=order[cursor++%order.length];
   if(positions[kind]<(pools[kind]||[]).length){mixed.push({kind,item:pools[kind][positions[kind]++]});picked=true;break}
  }
  if(!picked)break;
 }
 return mixed;
}

function durationSeconds(value){
 const parts=String(value||'').trim().split(':').map(Number);
 if(!parts.length||parts.some(n=>!Number.isFinite(n)))return 0;
 return parts.reduce((total,n)=>total*60+n,0);
}
function publishedRank(value){
 const textValue=String(value||'').trim();
 const relative=textValue.match(/(\d+)\s*(second|minute|hour|day|week|month|year)s?\s+ago/i);
 if(relative){
  const amount=Number(relative[1]),unit=relative[2].toLowerCase();
  const factor={second:1000,minute:60000,hour:3600000,day:86400000,week:604800000,month:2629800000,year:31557600000}[unit]||0;
  return Date.now()-amount*factor;
 }
 const parsed=Date.parse(textValue);return Number.isFinite(parsed)?parsed:0;
}
function sortedSearchItems(items,kind){
 const output=[...(items||[])];
 if(searchSort==='uploadDate')return output.sort((a,b)=>publishedRank(b.publishedText||b.date)-publishedRank(a.publishedText||a.date));
 if(searchSort==='viewCount'&&kind==='videos')return output.sort((a,b)=>(Number(b.viewCount)||0)-(Number(a.viewCount)||0));
 if(searchSort==='duration'&&(kind==='videos'||kind==='music'))return output.sort((a,b)=>durationSeconds(b.duration)-durationSeconds(a.duration));
 return output;
}

function renderPlayerProgress(position,duration){
 const seek=$('#playerSeek');if(!seek)return;
 const total=Math.max(0,Number(duration)||0),current=Math.max(0,Number(position)||0);
 seek.max=String(Math.max(total,1000));seek.value=String(Math.min(current,total||current));seek.disabled=!mediaState.hasItem||!mediaState.isMusic||total<=0;
 const elapsed=$('#playerElapsed'),length=$('#playerDuration');
 if(elapsed)elapsed.textContent=formatTrackTime(current);if(length)length.textContent=formatTrackTime(total);
}
function formatTrackTime(milliseconds){
 const seconds=Math.floor(Math.max(0,Number(milliseconds)||0)/1000);return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');
}
function renderPlayerState(){
 if(page!=='player')return;
 const isMusic=!!mediaState.hasItem&&!!mediaState.isMusic;
 const title=$('#playerTitle'),artist=$('#playerArtist'),status=$('#playerStatus'),img=$('#playerArtwork'),fallback=$('#playerArtFallback');
 if(title)title.textContent=isMusic?(mediaState.title||'Unknown track'):'Choose a track';
 if(artist)artist.textContent=isMusic?(mediaState.artist||'Unknown artist'):'Search or browse music, then select a track.';
 if(status)status.textContent=isMusic?(mediaState.isPlaying?'PLAYING':'PAUSED'):'Nothing is playing yet.';
 if(img&&fallback){
  const artwork=safeUrl(mediaState.artwork);
  if(isMusic&&artwork){img.onerror=()=>{img.hidden=true;fallback.hidden=false};img.src=artwork;img.hidden=false;fallback.hidden=true}
  else{img.removeAttribute('src');img.hidden=true;fallback.hidden=false}
 }
 const toggle=$('#playerToggle');if(toggle){toggle.innerHTML=ic(isMusic&&mediaState.isPlaying?'pause':'play');toggle.disabled=!isMusic}
 const previous=$('[data-player-prev]'),next=$('[data-player-next]');
 if(previous)previous.disabled=!isMusic;if(next)next.disabled=!isMusic;
 const lyrics=$('[data-player-lyrics-toggle]');if(lyrics)lyrics.disabled=!isMusic;
 const save=$('#playerSave');if(save)save.disabled=!isMusic;
 renderPlayerProgress(mediaState.position,mediaState.duration);
}

window.rushMusicLyrics=data=>{

  const matches=[...line.matchAll(/\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\]/g)];
  const text=line.slice(matches.length?matches[matches.length-1].index+matches[matches.length-1][0].length:0).trim();
