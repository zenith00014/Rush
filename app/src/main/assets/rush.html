<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1014"><title>RUSH</title>
<link rel="preconnect" href="https://i.ytimg.com" crossorigin><link rel="preconnect" href="https://news.google.com" crossorigin><link rel="stylesheet" href="styles/rush-base.css"><link rel="stylesheet" href="styles/four-page.css"></head>
<body>
<div class="app">
<header class="top" id="topAppBar">
    <div class="wm" aria-label="Rush">rush<i></i></div>
    <div><button class="ib notification-bell" id="notificationBell" data-open-notifications aria-label="Notifications">♧<span class="notification-dot" aria-hidden="true"></span></button></div>
  </header>
<main id="sc"><div id="v"></div></main>
  <div class="video-mini-dock" id="videoMiniDock" hidden>
    <div class="video-mini-host" id="videoMiniHost"></div>
    <div class="video-mini-actions"><b id="videoMiniTitle">Now playing</b><button class="chip" data-mini-expand aria-label="Expand video">↗</button><button class="chip" data-video-close aria-label="Close video">×</button></div>
  </div>
  <section class="mini" id="mini" aria-label="Now playing" inert>
    <div class="a" id="ma"><img alt="" hidden></div>
    <div><b id="mt"></b><span id="ms"></span></div>
    <button class="ib p" id="mp" data-act="toggle" aria-label="Play or pause"></button>
    <button class="ib" data-act="open" aria-label="Open player">↗</button>
    <div class="rule"></div>
  </section>
  
  <section class="app-sheet" id="notificationsSheet" hidden aria-modal="true" role="dialog" aria-labelledby="notificationsTitle">
    <header class="sheet-header"><b id="notificationsTitle">Notifications</b><button class="ib" data-close-sheet aria-label="Close notifications">×</button></header>
    <div class="sheet-body"><div class="sheet-empty"><span class="hardware-icon">◷</span><b>You're all caught up</b><p>Updates from your subscribed creators will appear here.</p><button class="btn o" data-sheet-subscriptions>View subscriptions</button></div></div>
  </section>
  <nav class="nav" id="nav" aria-label="Primary"></nav>
</div>
<script src="scripts/app-core.js"></script><script src="scripts/four-page-experience.js"></script><script src="scripts/profile-settings.js"></script><script src="scripts/bootstrap.js"></script>
</body></html>
